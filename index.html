<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Coin Collector Adventure</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  touch-action:none;
  background:#7dd3fc;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(#67c7f2 0%,#9ee8ff 65%,#55b82b 65%,#39a51f 100%);
}

/* Clouds */
.cloud{
  position:absolute;
  width:100px;
  height:35px;
  background:white;
  border-radius:50px;
  opacity:.8;
}

.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:45px;height:45px;
  left:15px;top:-20px;
}

.cloud:after{
  width:55px;height:55px;
  right:12px;top:-25px;
}

.c1{top:110px;left:5%}
.c2{top:180px;right:5%;transform:scale(.8)}

/* Trees */
.tree{
  position:absolute;
  bottom:30%;
  font-size:65px;
  z-index:1;
}

.t1{left:3%}
.t2{right:3%}
.t3{left:20%;font-size:45px}
.t4{right:20%;font-size:45px}

/* Road */
#road{
  position:absolute;
  bottom:0;
  width:100%;
  height:35%;
  background:#4caf24;
  border-top:5px solid #75d34c;
}

/* HUD */
#score,#level,#lives,#high{
  position:absolute;
  top:12px;
  background:white;
  padding:8px 11px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  z-index:20;
  box-shadow:0 3px 8px #0003;
}

#score{left:7px}
#level{left:50%;transform:translateX(-50%)}
#lives{right:7px}
#high{
  top:62px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
}

/* Character */
#player{
  position:absolute;
  width:58px;
  height:70px;
  left:50%;
  bottom:28%;
  transform:translateX(-50%);
  z-index:10;
  text-align:center;
}

.head{
  width:42px;
  height:42px;
  margin:auto;
  background:#ffd0a6;
  border:3px solid #333;
  border-radius:50%;
  position:relative;
}

.head:before{
  content:"";
  position:absolute;
  width:35px;
  height:12px;
  background:#4b2e1f;
  top:-5px;
  left:1px;
  border-radius:50%;
}

.body{
  width:45px;
  height:30px;
  background:#3498db;
  border:3px solid #333;
  border-radius:15px 15px 8px 8px;
  margin:auto;
}

/* Coin */
.coin{
  position:absolute;
  width:32px;
  height:32px;
  background:radial-gradient(circle,#fff38a 5%,#ffd700 40%,#f39c12 100%);
  border:4px solid #f39c12;
  border-radius:50%;
  z-index:6;
  box-shadow:0 2px 5px #0004;
}

/* Enemy */
.enemy{
  position:absolute;
  width:52px;
  height:52px;
  background:#e53935;
  border:4px solid white;
  border-radius:14px;
  text-align:center;
  line-height:44px;
  font-size:29px;
  z-index:7;
  box-shadow:0 3px 7px #0005;
}

/* Message */
#message{
  position:absolute;
  top:42%;
  width:100%;
  text-align:center;
  font-size:31px;
  font-weight:bold;
  color:white;
  text-shadow:2px 3px 5px #000;
  z-index:30;
  padding:10px;
}

#restart{
  display:none;
  position:absolute;
  top:54%;
  left:50%;
  transform:translateX(-50%);
  padding:15px 30px;
  border:0;
  border-radius:15px;
  background:white;
  font-size:21px;
  font-weight:bold;
  z-index:40;
}

/* Controls */
#controls{
  position:absolute;
  bottom:18px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:30px;
  z-index:50;
}

.control{
  width:90px;
  height:65px;
  border:3px solid white;
  border-radius:20px;
  background:#ffffffdd;
  font-size:34px;
  box-shadow:0 4px 8px #0004;
}

.control:active{
  transform:scale(.92);
  background:#ddd;
}

/* Start menu */
#menu{
  position:absolute;
  inset:0;
  background:linear-gradient(#38bdf8,#22c55e);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

#menu h1{
  font-size:38px;
  margin:10px;
  text-shadow:2px 3px 5px #555;
}

#menu p{
  font-size:18px;
}

#start{
  padding:16px 32px;
  border:0;
  border-radius:16px;
  background:white;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="tree t1">🌳</div>
<div class="tree t2">🌳</div>
<div class="tree t3">🌲</div>
<div class="tree t4">🌲</div>

<div id="road"></div>

<div id="menu">
  <h1>🪙 COIN ADVENTURE</h1>
  <p>Collect coins and escape the enemies!</p>
  <button id="start" onclick="startGame()">▶️ START GAME</button>
</div>

<div id="score">🪙 0</div>
<div id="level">⭐ Level 1</div>
<div id="lives">❤️❤️❤️</div>
<div id="high">🏆 High Score: 0</div>

<div id="player">
  <div class="head"></div>
  <div class="body"></div>
</div>

<div id="message"></div>

<button id="restart" onclick="location.reload()">🔄 RESTART</button>

<div id="controls">
  <button class="control" onclick="moveLeft()">⬅️</button>
  <button class="control" onclick="moveRight()">➡️</button>
</div>

</div>

<script>

let player=document.getElementById("player");
let scoreBox=document.getElementById("score");
let levelBox=document.getElementById("level");
let livesBox=document.getElementById("lives");
let highBox=document.getElementById("high");
let message=document.getElementById("message");
let menu=document.getElementById("menu");
let restart=document.getElementById("restart");

let playerX=50;
let score=0;
let lives=3;
let level=1;
let playing=false;
let highScore=Number(localStorage.getItem("coinHighScore")||0);

highBox.innerText="🏆 High Score: "+highScore;

/* Sound */
function sound(type){

  let audio=new (window.AudioContext||window.webkitAudioContext)();
  let osc=audio.createOscillator();
  let gain=audio.createGain();

  osc.connect(gain);
  gain.connect(audio.destination);

  if(type==="coin"){
    osc.frequency.value=700;
  }else{
    osc.frequency.value=150;
  }

  gain.gain.value=.12;
  osc.start();

  setTimeout(()=>{
    osc.stop();
    audio.close();
  },120);
}

/* Movement */
function moveLeft(){
  if(!playing)return;
  playerX-=8;
  if(playerX<5)playerX=5;
  player.style.left=playerX+"%";
}

function moveRight(){
  if(!playing)return;
  playerX+=8;
  if(playerX>95)playerX=95;
  player.style.left=playerX+"%";
}

/* Keyboard */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")moveLeft();
  if(e.key==="ArrowRight")moveRight();
});

/* Start */
function startGame(){

  menu.style.display="none";
  playing=true;

  score=0;
  lives=3;
  level=1;

  updateHUD();
}

/* HUD */
function updateHUD(){

  scoreBox.innerText="🪙 "+score;
  levelBox.innerText="⭐ Level "+level;

  let hearts="";
  for(let i=0;i<lives;i++) hearts+="❤️";

  livesBox.innerText=hearts;

  if(score>highScore){
    highScore=score;
    localStorage.setItem("coinHighScore",highScore);
  }

  highBox.innerText="🏆 High Score: "+highScore;
}

/* Coin */
function createCoin(){

  if(!playing)return;

  let coin=document.createElement("div");
  coin.className="coin";

  coin.style.left=(Math.random()*88+5)+"%";
  coin.style.top="0%";

  document.getElementById("game").appendChild(coin);

  let y=0;
  let speed=1.2+level*.25;

  let timer=setInterval(()=>{

    if(!playing){
      coin.remove();
      clearInterval(timer);
      return;
    }

    y+=speed;
    coin.style.top=y+"%";

    let a=coin.getBoundingClientRect();
    let b=player.getBoundingClientRect();

    if(
      a.left<b.right &&
      a.right>b.left &&
      a.top<b.bottom &&
      a.bottom>b.top
    ){

      score++;
      sound("coin");
      updateHUD();

      coin.remove();
      clearInterval(timer);

      if(score>=10){

        if(level<3){
          level++;
          score=0;

          message.innerText="🚀 LEVEL "+level+"!";

          updateHUD();

          setTimeout(()=>{
            message.innerText="";
          },1200);

        }else{
          win();
        }
      }
    }

    if(y>100){
      coin.remove();
      clearInterval(timer);
    }

  },50);
}

/* Enemy */
function createEnemy(){

  if(!playing)return;

  let enemy=document.createElement("div");

  enemy.className="enemy";
  enemy.innerText="👾";

  enemy.style.left=(Math.random()*88+5)+"%";
  enemy.style.top="0%";

  document.getElementById("game").appendChild(enemy);

  let y=0;
  let speed=1.3+level*.35;

  let timer=setInterval(()=>{

    if(!playing){
      enemy.remove();
      clearInterval(timer);
      return;
    }

    y+=speed;
    enemy.style.top=y+"%";

    let a=enemy.getBoundingClientRect();
    let b=player.getBoundingClientRect();

    if(
      a.left<b.right &&
      a.right>b.left &&
      a.top<b.bottom &&
      a.bottom>b.top
    ){

      lives--;
      sound("enemy");
      updateHUD();

      enemy.remove();
      clearInterval(timer);

      if(lives<=0)lose();
    }

    if(y>100){
      enemy.remove();
      clearInterval(timer);
    }

  },50);
}

/* Win */
function win(){

  playing=false;

  message.innerText="🏆 YOU WIN ALL 3 LEVELS! 🎉";
  restart.style.display="block";
}

/* Lose */
function lose(){

  playing=false;

  message.innerText="💀 GAME OVER";
  restart.style.display="block";
}

setInterval(createCoin,900);
setInterval(createEnemy,1800);

</script>

</body>
</html>
