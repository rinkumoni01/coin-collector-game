<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Collector</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#7dd3fc 70%,#4caf24 70%);
}

#menu{
  position:absolute;
  inset:0;
  background:linear-gradient(#38bdf8,#22c55e);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:100;
  color:white;
  text-align:center;
}

#menu h1{
  font-size:42px;
  margin:10px;
  text-shadow:2px 3px 4px #555;
}

#menu p{
  font-size:20px;
}

#startBtn,#restartBtn{
  padding:15px 30px;
  font-size:22px;
  font-weight:bold;
  border:0;
  border-radius:15px;
  background:white;
}

#score,#lives,#level{
  position:absolute;
  top:15px;
  background:white;
  padding:9px 13px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  z-index:10;
}

#score{left:10px}
#level{left:50%;transform:translateX(-50%)}
#lives{right:10px}

#player{
  position:absolute;
  width:52px;
  height:52px;
  background:#3498db;
  border:4px solid white;
  border-radius:50%;
  bottom:30%;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
}

.coin{
  position:absolute;
  width:30px;
  height:30px;
  background:#ffd700;
  border:4px solid #f39c12;
  border-radius:50%;
  z-index:4;
}

.enemy{
  position:absolute;
  width:48px;
  height:48px;
  background:#e74c3c;
  border:4px solid white;
  border-radius:10px;
  text-align:center;
  line-height:40px;
  font-size:28px;
  z-index:4;
}

#message{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  font-size:34px;
  font-weight:bold;
  color:white;
  text-shadow:2px 2px 5px black;
  z-index:20;
}

#restartBtn{
  display:none;
  position:absolute;
  top:52%;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
}

#controls{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  z-index:20;
}

.control{
  width:70px;
  height:55px;
  margin:5px;
  font-size:25px;
  border:0;
  border-radius:15px;
}
</style>
</head>

<body>

<div id="game">

  <div id="menu">
    <h1>🪙 COIN COLLECTOR</h1>
    <p>Collect 10 coins to complete each level!</p>
    <button id="startBtn" onclick="startGame()">▶️ START GAME</button>
  </div>

  <div id="score">🪙 Coins: 0</div>
  <div id="level">⭐ Level 1</div>
  <div id="lives">❤️❤️❤️</div>

  <div id="player"></div>

  <div id="message"></div>

  <button id="restartBtn" onclick="restartGame()">🔄 RESTART</button>

  <div id="controls">
    <button class="control" onclick="moveLeft()">⬅️</button>
    <button class="control" onclick="moveRight()">➡️</button>
  </div>

</div>

<script>

let player=document.getElementById("player");
let game=document.getElementById("game");
let scoreText=document.getElementById("score");
let livesText=document.getElementById("lives");
let levelText=document.getElementById("level");
let message=document.getElementById("message");
let menu=document.getElementById("menu");
let restartBtn=document.getElementById("restartBtn");

let playerX=50;
let score=0;
let lives=3;
let level=1;
let gameRunning=false;
let targetCoins=10;

function updatePlayer(){
  player.style.left=playerX+"%";
}

function moveLeft(){
  if(!gameRunning)return;

  playerX-=8;

  if(playerX<5)playerX=5;

  updatePlayer();
}

function moveRight(){
  if(!gameRunning)return;

  playerX+=8;

  if(playerX>95)playerX=95;

  updatePlayer();
}

function updateLives(){

  let hearts="";

  for(let i=0;i<lives;i++){
    hearts+="❤️";
  }

  livesText.innerText=hearts;
}

function startGame(){

  menu.style.display="none";
  gameRunning=true;

  score=0;
  lives=3;
  level=1;

  scoreText.innerText="🪙 Coins: 0";
  levelText.innerText="⭐ Level 1";
  message.innerText="";

  updateLives();
}

function createCoin(){

  if(!gameRunning)return;

  let coin=document.createElement("div");

  coin.className="coin";

  coin.style.left=(Math.random()*90+5)+"%";
  coin.style.top="5%";

  game.appendChild(coin);

  let y=5;

  let speed=1.2+(level*0.2);

  let fall=setInterval(function(){

    if(!gameRunning){
      coin.remove();
      clearInterval(fall);
      return;
    }

    y+=speed;

    coin.style.top=y+"%";

    let a=coin.getBoundingClientRect();
    let b=player.getBoundingClientRect();

    if(
      a.left<b.right &&
      a.right>b.left &&
      a.top<b.bottom &&
      a.bottom>b.top
    ){

      score++;

      scoreText.innerText="🪙 Coins: "+score;

      coin.remove();

      clearInterval(fall);

      if(score>=targetCoins){

        if(level<3){
          nextLevel();
        }else{
          winGame();
        }
      }
    }

    if(y>100){

      coin.remove();
      clearInterval(fall);
    }

  },50);
}

function createEnemy(){

  if(!gameRunning)return;

  let enemy=document.createElement("div");

  enemy.className="enemy";
  enemy.innerText="👾";

  enemy.style.left=(Math.random()*90+5)+"%";
  enemy.style.top="5%";

  game.appendChild(enemy);

  let y=5;

  let speed=1.3+(level*0.35);

  let fall=setInterval(function(){

    if(!gameRunning){

      enemy.remove();
      clearInterval(fall);
      return;
    }

    y+=speed;

    enemy.style.top=y+"%";

    let a=enemy.getBoundingClientRect();
    let b=player.getBoundingClientRect();

    if(
      a.left<b.right &&
      a.right>b.left &&
      a.top<b.bottom &&
      a.bottom>b.top
    ){

      lives--;

      updateLives();

      enemy.remove();

      clearInterval(fall);

      if(lives<=0){

        loseGame();
      }
    }

    if(y>100){

      enemy.remove();
      clearInterval(fall);
    }

  },50);
}

function nextLevel(){

  level++;

  score=0;

  scoreText.innerText="🪙 Coins: 0";
  levelText.innerText="⭐ Level "+level;

  message.innerText="🚀 LEVEL "+level+"!";

  setTimeout(function(){

    if(gameRunning){
      message.innerText="";
    }

  },1200);
}

function winGame(){

  gameRunning=false;

  message.innerText="🏆 YOU WIN ALL 3 LEVELS! 🎉";

  restartBtn.style.display="block";
}

function loseGame(){

  gameRunning=false;

  message.innerText="💀 GAME OVER";

  restartBtn.style.display="block";
}

function restartGame(){

  location.reload();
}

/* Coins */

setInterval(function(){

  if(gameRunning){
    createCoin();
  }

},900);

/* Enemies */

setInterval(function(){

  if(gameRunning){
    createEnemy();
  }

},1800);

updatePlayer();
updateLives();

</script>

</body>
</html>
